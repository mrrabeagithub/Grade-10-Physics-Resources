<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>G10 Physics: Reflection of Light</title>
    <!-- MathJax for Formula Rendering -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --border: #e2e8f0;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --primary: #60a5fa;
            --primary-hover: #3b82f6;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            margin: 1rem;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* Utility Classes */
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .justify-between { justify-content: space-between; }
        .items-center { align-items: center; }
        .gap-4 { gap: 1rem; }
        .w-full { width: 100%; }
        .mt-4 { margin-top: 1rem; }
        .text-center { text-align: center; }
        .font-bold { font-weight: 700; }
        .text-xl { font-size: 1.25rem; }
        .text-sm { font-size: 0.875rem; }
        .mb-2 { margin-bottom: 0.5rem; }

        /* Inputs & Buttons */
        input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: var(--bg-color);
            color: var(--text-main);
            font-size: 1rem;
            margin-bottom: 1rem;
            box-sizing: border-box;
        }

        input:focus { outline: none; border-color: var(--primary); }

        button {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            touch-action: manipulation;
        }

        button:active { transform: scale(0.98); }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-outline { background: transparent; border: 2px solid var(--border); color: var(--text-sub); }
        .btn-outline:hover { border-color: var(--text-main); color: var(--text-main); }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }

        /* Quiz Specifics */
        .progress-bar {
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .option-card {
            padding: 1rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            margin-bottom: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: flex-start;
            text-align: left;
            width: 100%;
            box-sizing: border-box;
        }

        .option-card:hover {
            border-color: var(--primary);
            background: rgba(59, 130, 246, 0.05);
        }

        .option-card.selected {
            border-color: var(--primary);
            background: rgba(59, 130, 246, 0.1);
        }

        .option-letter {
            font-weight: bold;
            margin-right: 1rem;
            color: var(--primary);
            min-width: 24px;
        }

        .hint-box {
            background: rgba(245, 158, 11, 0.1);
            border-left: 4px solid #f59e0b;
            padding: 1rem;
            margin-top: 1rem;
            border-radius: 4px;
            color: var(--text-main);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        /* Header */
        .header-controls {
            position: absolute;
            top: 1rem;
            right: 1rem;
            display: flex;
            gap: 0.5rem;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0.25rem;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header Controls -->
        <div class="header-controls">
            <button class="icon-btn" onclick="toggleTheme()" title="Toggle Dark Mode">🌓</button>
        </div>

        <!-- VIEW: LOGIN -->
        <div id="view-login">
            <h1 class="text-xl font-bold text-center">Physics Smart-Sheet</h1>
            <p class="text-center text-sub" style="color: var(--text-sub); margin-bottom: 2rem;">Chapter 10: Reflection of Light</p>
            
            <div id="login-error" class="hidden text-center" style="color: var(--danger); margin-bottom: 1rem;">Invalid Access Code</div>
            
            <label class="text-sm font-bold">Enter Access Code</label>
            <input type="password" id="access-code" placeholder="4-digit code" maxlength="4" onkeyup="if(event.key === 'Enter') validateLogin()">
            
            <button class="btn-primary w-full" onclick="validateLogin()">Start Worksheet</button>
            <p class="text-center text-sm mt-4" style="color: var(--text-sub);">G10 - 2024/2025</p>
        </div>

        <!-- VIEW: QUIZ -->
        <div id="view-quiz" class="hidden">
            <div class="flex justify-between items-center" style="margin-bottom: 1rem;">
                <span class="font-bold" id="student-display-name">Student</span>
                <span class="text-sm" style="color: var(--text-sub)">Q <span id="current-q-num">1</span> of 10</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>

            <div id="question-container">
                <!-- Dynamic Content Injected Here -->
            </div>

            <div id="hint-container" class="hidden hint-box"></div>

            <div class="flex justify-between mt-4">
                <button class="btn-outline" onclick="toggleHint()" id="btn-hint">💡 Show Hint</button>
                <div class="flex gap-4">
                    <button class="btn-outline hidden" id="btn-prev" onclick="nav(-1)">Back</button>
                    <button class="btn-primary" id="btn-next" onclick="nav(1)">Next</button>
                    <button class="btn-success hidden" id="btn-submit" onclick="submitQuiz()">Submit</button>
                </div>
            </div>
        </div>

        <!-- VIEW: RESULTS -->
        <div id="view-results" class="hidden text-center">
            <h1 class="text-xl font-bold">Worksheet Complete!</h1>
            <div style="font-size: 4rem; font-weight: bold; color: var(--primary); margin: 2rem 0;">
                <span id="final-score">0</span>%
            </div>
            <p id="submit-status" style="color: var(--text-sub);">Syncing with gradebook...</p>
            <button class="btn-outline mt-4" onclick="window.print()">🖨️ Print / Save PDF</button>
        </div>
    </div>

<script>
/**
 * SMART-SHEET ARCHITECT CONFIGURATION
 * Generated for: Grade 10
 * Topic: Reflection of Light
 */

const CONFIG = {
    grade: "Grade 10",
    topic: "Reflection of Light",
    url: "https://script.google.com/macros/s/AKfycby8z3emuwK7eYdUNgh1aO4Bi7XVouzJbwPj3lApaMf7O3zKOO86lk-ZWHi4v5nHQdEc6Q/exec",
    students: {
        "Teacher": "0000",
        "Tutor": "1111",
        "انس / زياد / الجندي": "9732", "براء / سعيد / ميناوي": "1590", "دانيال / علي / لاغا": "2083", 
        "رام / زياد / عنتر": "1844", "سعد / ربيع / قلموني": "1977", "سعيد / محمد / عابدي": "2682", 
        "عاصم / خليل / مكاوي": "1979", "عبد الرحمن / احمد / بركات": "7362", "عبد الرحمن / خالد / درويش": "9700", 
        "عبد الرحمن / مصطفى / الست": "8928", "عبد الملك / mروان / عاصي": "7242", "عمر / عدنان / قرقوبي": "1950", 
        "عمر / محمود / قدور": "9363", "غالب / طاهر / عطيه": "7843", "قصي / علاء الدين / قتة": "2146", 
        "كريم / محمد سمير / اللحام": "5659", "محمد / احمد / السايس": "3327", "محمد / حسن / المصري": "1879", 
        "محمد / سامر / المهاجر": "1385", "محمد كنان / عمران / قتة": "1148", "مروان / حسام / عبد الرحمن": "4776", 
        "مصطفى / هاشم / عجم": "7894", "نور الدين / سيف الدين / الخالدي": "8297", "يوسف / خضر / باليظه": "1418"
    }
};

const QUESTIONS = [
    {
        id: 1,
        text: "What is the phenomenon called when light hits a smooth surface and bounces back into the same medium?",
        options: [
            "Refraction",
            "Absorption",
            "Reflection",
            "Diffraction"
        ],
        correct: 2,
        hint: "Think about looking at yourself in a mirror."
    },
    {
        id: 2,
        text: "The ray of light that strikes the reflecting surface is called the:",
        options: [
            "Normal ray",
            "Reflected ray",
            "Incident ray",
            "Emergent ray"
        ],
        correct: 2,
        hint: "It's the ray that 'falls' onto the surface."
    },
    {
        id: 3,
        text: "According to the first law of reflection, the angle of incidence (\\(i\\)) is always ______ the angle of reflection (\\(r\\)).",
        options: [
            "Greater than",
            "Less than",
            "Equal to",
            "Half of"
        ],
        correct: 2,
        hint: "\\(i = r\\)."
    },
    {
        id: 4,
        text: "The 'Normal' at the point of incidence is a line that is:",
        options: [
            "Parallel to the surface",
            "Perpendicular to the surface",
            "At a 45-degree angle to the surface",
            "Curved"
        ],
        correct: 1,
        hint: "Normal means 'at right angles' in geometry."
    },
    {
        id: 5,
        text: "If a light ray strikes a plane mirror at an angle of incidence of 30°, what is the angle of reflection?",
        options: [
            "60°",
            "90°",
            "30°",
            "0°"
        ],
        correct: 2,
        hint: "Apply the law: \\(i = r\\)."
    },
    {
        id: 6,
        text: "Specular (regular) reflection occurs when light hits a surface that is:",
        options: [
            "Rough and dull",
            "Smooth and polished",
            "Transparent",
            "Opaque and bumpy"
        ],
        correct: 1,
        hint: "Think of a mirror vs. a piece of paper."
    },
    {
        id: 7,
        text: "Diffuse (irregular) reflection allows us to see objects from different angles because the light is:",
        options: [
            "Absorbed by the surface",
            "Reflected in a single direction",
            "Scattered in many directions",
            "Turned into heat"
        ],
        correct: 2,
        hint: "This happens on rough surfaces."
    },
    {
        id: 8,
        text: "An image that cannot be caught on a screen and is formed behind a mirror is called a:",
        options: [
            "Real image",
            "Virtual image",
            "Inverted image",
            "Magnified image"
        ],
        correct: 1,
        hint: "It seems to be there, but rays don't actually meet."
    },
    {
        id: 9,
        text: "In a plane mirror, the distance of the object from the mirror is ______ the distance of the image from the mirror.",
        options: [
            "Twice",
            "Half of",
            "Equal to",
            "Unrelated to"
        ],
        correct: 2,
        hint: "If you move closer, your reflection moves closer."
    },
    {
        id: 10,
        text: "What do we call the effect where the left side of an object appears as the right side in its mirror image?",
        options: [
            "Refraction",
            "Vertical inversion",
            "Lateral inversion",
            "Magnification"
        ],
        correct: 2,
        hint: "Lateral means 'side'."
    }
];

// STATE
let currentUser = null;
let currentQIndex = 0;
let userAnswers = new Array(QUESTIONS.length).fill(null);

// DOM ELEMENTS
const dom = {
    login: document.getElementById('view-login'),
    quiz: document.getElementById('view-quiz'),
    results: document.getElementById('view-results'),
    inputCode: document.getElementById('access-code'),
    errorMsg: document.getElementById('login-error'),
    studentName: document.getElementById('student-display-name'),
    qContainer: document.getElementById('question-container'),
    progress: document.getElementById('progress-fill'),
    currQNum: document.getElementById('current-q-num'),
    hintBox: document.getElementById('hint-container'),
    btnNext: document.getElementById('btn-next'),
    btnPrev: document.getElementById('btn-prev'),
    btnSubmit: document.getElementById('btn-submit')
};

// --- INITIALIZATION ---
function validateLogin() {
    const code = dom.inputCode.value.trim();
    const studentName = Object.keys(CONFIG.students).find(name => CONFIG.students[name] === code);

    if (studentName) {
        currentUser = studentName;
        dom.login.classList.add('hidden');
        dom.quiz.classList.remove('hidden');
        dom.studentName.innerText = studentName.split('/')[0];
        loadQuestion(0);
    } else {
        dom.errorMsg.classList.remove('hidden');
        dom.inputCode.value = '';
    }
}

function loadQuestion(index) {
    currentQIndex = index;
    const q = QUESTIONS[index];
    
    dom.progress.style.width = `${((index + 1) / QUESTIONS.length) * 100}%`;
    dom.currQNum.innerText = index + 1;
    
    dom.hintBox.classList.add('hidden');
    dom.hintBox.innerText = q.hint;

    let html = `
        <h2 class="text-xl font-bold mb-4">${q.text}</h2>
        <div class="flex flex-col gap-2">
    `;

    q.options.forEach((opt, i) => {
        const isSelected = userAnswers[index] === i ? 'selected' : '';
        html += `
            <div class="option-card ${isSelected}" onclick="selectOption(${i}, this)">
                <div class="option-letter">${String.fromCharCode(65+i)}</div>
                <div>${opt}</div>
            </div>
        `;
    });
    html += `</div>`;

    dom.qContainer.innerHTML = html;
    
    dom.btnPrev.classList.toggle('hidden', index === 0);
    if (index === QUESTIONS.length - 1) {
        dom.btnNext.classList.add('hidden');
        dom.btnSubmit.classList.remove('hidden');
    } else {
        dom.btnNext.classList.remove('hidden');
        dom.btnSubmit.classList.add('hidden');
    }

    if (window.MathJax) MathJax.typeset();
}

function selectOption(optIndex, cardElem) {
    userAnswers[currentQIndex] = optIndex;
    const allOptions = document.querySelectorAll('.option-card');
    allOptions.forEach(el => el.classList.remove('selected'));
    cardElem.classList.add('selected');
}

function nav(direction) {
    const newIndex = currentQIndex + direction;
    if (newIndex >= 0 && newIndex < QUESTIONS.length) {
        loadQuestion(newIndex);
    }
}

function toggleHint() {
    dom.hintBox.classList.toggle('hidden');
}

function toggleTheme() {
    const body = document.body;
    const current = body.getAttribute('data-theme');
    body.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
}

async function submitQuiz() {
    let correctCount = 0;
    let details = [];

    QUESTIONS.forEach((q, i) => {
        const userChoice = userAnswers[i];
        const isCorrect = userChoice === q.correct;
        if (isCorrect) correctCount++;
        const letter = userChoice !== null ? String.fromCharCode(65 + userChoice) : "Empty";
        details.push(`Q${i+1}: ${letter}`);
    });

    const finalScore = Math.round((correctCount / QUESTIONS.length) * 100);

    dom.quiz.classList.add('hidden');
    dom.results.classList.remove('hidden');
    document.getElementById('final-score').innerText = finalScore;

    const payload = {
        name: currentUser,
        score: finalScore,
        topic: CONFIG.topic,
        answers: details.join(", ")
    };

    try {
        await fetch(CONFIG.url, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify(payload)
        });
        document.getElementById('submit-status').innerText = "✅ Successfully recorded in Grade 10 database.";
        document.getElementById('submit-status').style.color = "var(--success)";
    } catch (e) {
        document.getElementById('submit-status').innerText = "⚠️ Network error. Please screenshot this page and show your teacher.";
        document.getElementById('submit-status').style.color = "var(--danger)";
        console.error(e);
    }
}
</script>
</body>
</html>
