<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plane Mirror Ray Diagram</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; }
        canvas { 
            touch-action: none; 
            cursor: pointer;
        }
        .controls button { transition: all 0.2s ease-in-out; }
        .controls button:hover { transform: scale(1.05); }
        .controls button:active { transform: scale(0.95); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-4xl w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        <!-- Header -->
        <div class="bg-slate-800 text-white p-6 text-center relative">
            <h1 class="text-2xl font-bold mb-2">Ray Diagram: Plane Mirror</h1>
            <p class="text-slate-300 text-sm max-w-2xl mx-auto">
                Click the object's top (A) or bottom (B) to trace the rays and locate the virtual image. 
                Observe the normal and oblique incident rays obeying the laws of reflection.
            </p>
            <p class="text-xs font-semibold text-blue-400 mt-3 tracking-wide uppercase">By Rabih A.G.</p>
        </div>

        <!-- Canvas Container -->
        <div class="relative w-full flex justify-center p-4 bg-slate-50">
            <canvas id="simCanvas" width="800" height="600" class="bg-white border border-slate-300 rounded shadow-inner max-w-full h-auto" style="aspect-ratio: 4/3;"></canvas>
        </div>

        <!-- Controls -->
        <div class="controls flex flex-wrap justify-center items-center gap-4 p-6 bg-slate-100 border-t border-slate-200">
            <!-- Shape Selector -->
            <div class="flex items-center gap-3 bg-white px-4 py-2 rounded-lg border border-slate-300 shadow-sm">
                <span class="text-sm font-bold text-slate-700">Shape:</span>
                <label class="inline-flex items-center cursor-pointer">
                    <input type="radio" name="shape" value="arrow" checked class="form-radio text-blue-600 w-4 h-4" onchange="changeShape('arrow')">
                    <span class="ml-2 text-sm font-medium">Arrow</span>
                </label>
                <label class="inline-flex items-center cursor-pointer">
                    <input type="radio" name="shape" value="A" class="form-radio text-blue-600 w-4 h-4" onchange="changeShape('A')">
                    <span class="ml-2 text-sm font-medium">A</span>
                </label>
                <label class="inline-flex items-center cursor-pointer">
                    <input type="radio" name="shape" value="L" class="form-radio text-blue-600 w-4 h-4" onchange="changeShape('L')">
                    <span class="ml-2 text-sm font-medium">L</span>
                </label>
                <label class="inline-flex items-center cursor-pointer">
                    <input type="radio" name="shape" value="U" class="form-radio text-blue-600 w-4 h-4" onchange="changeShape('U')">
                    <span class="ml-2 text-sm font-medium">U</span>
                </label>
            </div>

            <button onclick="triggerA()" class="px-6 py-3 bg-red-600 text-white font-semibold rounded-lg shadow-md hover:bg-red-700 flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
                Trace Rays from A
            </button>
            <button onclick="triggerB()" class="px-6 py-3 bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700 flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
                Trace Rays from B
            </button>
            <button onclick="resetSim()" class="px-6 py-3 bg-slate-500 text-white font-semibold rounded-lg shadow-md hover:bg-slate-600 flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                Reset
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // Physics/Geometry Constants
        const GRID_SIZE = 40;
        const MIRROR_X = 400;
        const MIRROR_Y_TOP = 100;
        const MIRROR_Y_BOT = 500;
        
        // Object coordinates
        const OBJ_X = 240; // 4 grid units left of mirror
        const OBJ_Y_A = 260;
        const OBJ_Y_B = 340;
        
        // Image coordinates
        const IMG_X = 560; // 4 grid units right of mirror
        
        // Oblique hit points on the mirror
        const HIT_A_OBLIQUE = 140; // Hit point for oblique ray from A
        const HIT_B_OBLIQUE = 460; // Hit point for oblique ray from B

        // Current Shape State
        let currentShape = 'arrow';

        // Animation States (0: idle, 1: incident 1, 2: reflect/extend 1, 3: delay, 4: incident 2, 5: reflect/extend 2, 6: done)
        let animA = { phase: 0, progress: 0 };
        let animB = { phase: 0, progress: 0 };
        
        const ANIM_SPEED = 0.0015; // Animation progress per ms
        let lastTime = 0;
        let animationFrameId;

        // Interaction areas
        const RADIUS = 25;

        // Start animation loop
        requestAnimationFrame(gameLoop);

        function gameLoop(time) {
            if (!lastTime) lastTime = time;
            const dt = time - lastTime;
            lastTime = time;

            update(dt);
            draw();

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function update(dt) {
            // Update A
            if (animA.phase >= 1 && animA.phase < 6) {
                let speed = (animA.phase === 3) ? ANIM_SPEED * 1.5 : ANIM_SPEED; // slightly faster delay
                animA.progress += dt * speed;
                if (animA.progress >= 1) {
                    animA.progress = 0;
                    animA.phase++;
                }
            }
            // Update B
            if (animB.phase >= 1 && animB.phase < 6) {
                let speed = (animB.phase === 3) ? ANIM_SPEED * 1.5 : ANIM_SPEED;
                animB.progress += dt * speed;
                if (animB.progress >= 1) {
                    animB.progress = 0;
                    animB.phase++;
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            drawGrid();
            drawMirror();
            drawObject();
            
            const { pA, pB } = getPoints();

            // Draw Rays for A
            if (animA.phase > 0) {
                drawRaySystem(
                    pA.x, pA.y,                // Origin (A)
                    HIT_A_OBLIQUE,             // Oblique Y hit
                    2 * MIRROR_X - pA.x, pA.y, // Image Point (A')
                    '#dc2626',                 // Red color
                    animA.phase, animA.progress,
                    'A\''
                );
            }

            // Draw Rays for B
            if (animB.phase > 0) {
                drawRaySystem(
                    pB.x, pB.y,                // Origin (B)
                    HIT_B_OBLIQUE,             // Oblique Y hit
                    2 * MIRROR_X - pB.x, pB.y, // Image Point (B')
                    '#2563eb',                 // Blue color
                    animB.phase, animB.progress,
                    'B\''
                );
            }

            // Draw full image if both are done
            if (animA.phase === 6 && animB.phase === 6) {
                drawVirtualImage();
            }

            // Draw interactive pulsing hints if not yet clicked
            drawClickHints();
        }

        function drawGrid() {
            // Darker and bolder main grid lines
            ctx.strokeStyle = '#94a3b8'; // darker slate color
            ctx.lineWidth = 2; // bolder line weight
            ctx.beginPath();
            for (let x = 0; x <= canvas.width; x += GRID_SIZE) {
                ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
            }
            for (let y = 0; y <= canvas.height; y += GRID_SIZE) {
                ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
            }
            ctx.stroke();

            // Lighter Central Axis
            ctx.strokeStyle = '#cbd5e1'; // lighter slate color
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(0, 300); ctx.lineTo(canvas.width, 300);
            ctx.stroke();
        }

        function drawMirror() {
            // Mirror back hashing
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let y = MIRROR_Y_TOP; y <= MIRROR_Y_BOT; y += 10) {
                ctx.moveTo(MIRROR_X, y);
                ctx.lineTo(MIRROR_X + 10, y - 10);
            }
            ctx.stroke();

            // Mirror reflective surface (left side)
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(MIRROR_X, MIRROR_Y_TOP);
            ctx.lineTo(MIRROR_X, MIRROR_Y_BOT);
            ctx.stroke();

            // Label
            ctx.fillStyle = '#334155';
            ctx.font = '16px sans-serif';
            ctx.fillText('Plane Mirror', MIRROR_X - 45, MIRROR_Y_TOP - 20);
        }

        function getPoints() {
            const w = 40;
            let pA = { x: OBJ_X, y: OBJ_Y_A };
            let pB = { x: OBJ_X, y: OBJ_Y_B };

            // Adjust Point A for the tip of the 'A' shape
            if (currentShape === 'A') {
                pA.x = OBJ_X + w/2; 
            }
            return { pA, pB };
        }

        function drawShape(baseX, yA, yB, isImage) {
            const w = 40;
            // Laterally invert (flip horizontally) if drawing the virtual image
            const flip = (vx) => isImage ? (2 * MIRROR_X - vx) : vx;
            
            ctx.beginPath();
            
            if (currentShape === 'arrow') {
                ctx.moveTo(flip(baseX), yB);
                ctx.lineTo(flip(baseX), yA);
                ctx.stroke();
                drawArrowHead(flip(baseX), yA, -Math.PI/2, isImage ? '#64748b' : '#0f172a', 12);
            } else if (currentShape === 'L') {
                ctx.moveTo(flip(baseX), yA);
                ctx.lineTo(flip(baseX), yB);
                ctx.lineTo(flip(baseX + w), yB);
                ctx.stroke();
            } else if (currentShape === 'U') {
                ctx.moveTo(flip(baseX), yA);
                ctx.lineTo(flip(baseX), yB - 15);
                ctx.quadraticCurveTo(flip(baseX), yB, flip(baseX + w/2), yB);
                ctx.quadraticCurveTo(flip(baseX + w), yB, flip(baseX + w), yB - 15);
                ctx.lineTo(flip(baseX + w), yA);
                ctx.stroke();
            } else if (currentShape === 'A') {
                ctx.moveTo(flip(baseX), yB); 
                ctx.lineTo(flip(baseX + w/2), yA); 
                ctx.lineTo(flip(baseX + w), yB); 
                ctx.moveTo(flip(baseX + w/4), (yA + yB)/2 + 10);
                ctx.lineTo(flip(baseX + 3*w/4), (yA + yB)/2 + 10);
                ctx.stroke();
            }
        }

        function drawObject() {
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 4;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            
            drawShape(OBJ_X, OBJ_Y_A, OBJ_Y_B, false);

            const { pA, pB } = getPoints();

            // Labels
            ctx.fillStyle = '#0f172a';
            ctx.font = 'bold 18px sans-serif';
            ctx.fillText('A', pA.x - 25, pA.y + 5);
            ctx.fillText('B', pB.x - 25, pB.y + 5);
            
            // "Object" Label
            ctx.font = '14px sans-serif';
            ctx.fillText('Object', OBJ_X - 60, (OBJ_Y_A + OBJ_Y_B)/2 + 5);
        }

        function drawVirtualImage() {
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 4;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.setLineDash([8, 8]); // Dashed line for virtual image
            
            drawShape(OBJ_X, OBJ_Y_A, OBJ_Y_B, true);
            
            ctx.setLineDash([]); // Reset dash

            // Labels
            ctx.fillStyle = '#64748b';
            ctx.font = 'bold 18px sans-serif';
            ctx.fillText('Image', IMG_X + 20, (OBJ_Y_A + OBJ_Y_B)/2 + 5);
            
            // Distance indicators
            drawDistanceIndicator(OBJ_X, MIRROR_X, 550, 'd');
            drawDistanceIndicator(MIRROR_X, IMG_X, 550, 'd');
        }

        function drawDistanceIndicator(x1, x2, y, text) {
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(x1, y - 5); ctx.lineTo(x1, y + 5);
            ctx.moveTo(x2, y - 5); ctx.lineTo(x2, y + 5);
            ctx.moveTo(x1, y); ctx.lineTo(x2, y);
            ctx.stroke();
            
            ctx.fillStyle = '#64748b';
            ctx.font = 'italic 14px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(text, (x1 + x2)/2, y - 8);
            ctx.textAlign = 'left'; // reset
        }

        function drawRaySystem(ox, oy, hitY, imgX, imgY, color, phase, progress, labelPoint) {
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 2;

            // Math Setup
            // Normal Ray
            const normP1 = {x: ox, y: oy};
            const normM = {x: MIRROR_X, y: oy};
            const normR = {x: ox - 200, y: oy}; // Reflected way back

            // Oblique Ray
            const oblP1 = {x: ox, y: oy};
            const oblM = {x: MIRROR_X, y: hitY};
            // Calculate reflected vector dynamically based on ray origin distance
            const dx = MIRROR_X - ox;
            const dy = hitY - oy;
            const oblR = {x: MIRROR_X - dx*1.5, y: hitY + dy*1.5}; // Extend reflected ray

            // Phase 1: Ray 1 (Normal) Incident
            if (phase >= 1) {
                ctx.strokeStyle = color;
                ctx.fillStyle = color;
                const t = (phase === 1) ? progress : 1;
                drawSegment(normP1, lerp(normP1, normM, t));
                if (t > 0.5) drawArrowHeadMid(normP1, normM, color);
            }

            // Phase 2: Ray 1 (Normal) Reflected & Extension
            if (phase >= 2) {
                ctx.strokeStyle = color;
                ctx.fillStyle = color;
                const t = (phase === 2) ? progress : 1;
                drawSegment(normM, lerp(normM, normR, t));
                if (t > 0.3) {
                    drawArrowHead(lerp(normM, normR, 0.4), Math.PI, color, 10);
                }

                // Extension (Higher Contrast)
                ctx.setLineDash([6, 4]);
                drawSegment(normM, lerp(normM, {x: imgX, y: imgY}, t));
                ctx.setLineDash([]);
            }

            // Phase 3 is a delay, Phase 4 starts Ray 2 (Oblique) Incident
            if (phase >= 4) {
                ctx.strokeStyle = color;
                ctx.fillStyle = color;
                const t = (phase === 4) ? progress : 1;
                drawSegment(oblP1, lerp(oblP1, oblM, t));
                if (t > 0.5) drawArrowHeadMid(oblP1, oblM, color);

                // Normal Line at point of incidence
                if (t > 0.9 || phase > 4) {
                    drawDashedLine({x: MIRROR_X - 50, y: hitY}, {x: MIRROR_X + 50, y: hitY}, '#94a3b8');
                }
            }

            // Phase 5: Ray 2 (Oblique) Reflected & Extension
            if (phase >= 5) {
                ctx.strokeStyle = color;
                ctx.fillStyle = color;
                const t = (phase === 5) ? progress : 1;
                drawSegment(oblM, lerp(oblM, oblR, t));
                if (t > 0.5) drawArrowHeadMid(oblM, oblR, color);

                // Extension (Higher Contrast)
                ctx.setLineDash([6, 4]);
                drawSegment(oblM, lerp(oblM, {x: imgX, y: imgY}, t));
                ctx.setLineDash([]);
            }

            // Phase 6: Draw Image Point intersection
            if (phase === 6) {
                ctx.strokeStyle = color;
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(imgX, imgY, 4, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.font = 'bold 18px sans-serif';
                ctx.fillText(labelPoint, imgX + 10, imgY + 5);
            }
        }

        // --- Helper Math & Drawing Functions ---

        function lerp(p1, p2, t) {
            return {
                x: p1.x + (p2.x - p1.x) * t,
                y: p1.y + (p2.y - p1.y) * t
            };
        }

        function drawSegment(p1, p2) {
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
        }

        function drawDashedLine(p1, p2, color) {
            ctx.strokeStyle = color;
            ctx.lineWidth = 1;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawArrowHead(x, y, angle, color, size = 10) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x - size * Math.cos(angle - Math.PI/6), y - size * Math.sin(angle - Math.PI/6));
            ctx.lineTo(x - size * Math.cos(angle + Math.PI/6), y - size * Math.sin(angle + Math.PI/6));
            ctx.closePath();
            ctx.fill();
        }

        function drawArrowHeadMid(p1, p2, color) {
            const midX = (p1.x + p2.x) / 2;
            const midY = (p1.y + p2.y) / 2;
            const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
            drawArrowHead(midX, midY, angle, color);
        }

        function drawClickHints() {
            const time = Date.now() / 200;
            const radiusOffset = Math.sin(time) * 4;
            const { pA, pB } = getPoints();

            if (animA.phase === 0) {
                ctx.strokeStyle = `rgba(220, 38, 38, ${0.5 + Math.sin(time)*0.3})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(pA.x, pA.y, RADIUS + radiusOffset, 0, Math.PI * 2);
                ctx.stroke();
            }

            if (animB.phase === 0) {
                ctx.strokeStyle = `rgba(37, 99, 235, ${0.5 + Math.sin(time)*0.3})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(pB.x, pB.y, RADIUS + radiusOffset, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        // --- Interaction Logic ---

        function changeShape(shape) {
            currentShape = shape;
            resetSim();
        }

        function triggerA() {
            if (animA.phase === 0) {
                animA.phase = 1;
                animA.progress = 0;
            }
        }

        function triggerB() {
            if (animB.phase === 0) {
                animB.phase = 1;
                animB.progress = 0;
            }
        }

        function resetSim() {
            animA = { phase: 0, progress: 0 };
            animB = { phase: 0, progress: 0 };
        }

        // Click detection on Canvas
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            // Calculate scale in case CSS resizes the canvas
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;

            const { pA, pB } = getPoints();

            // Check distance to A
            if (Math.hypot(x - pA.x, y - pA.y) < RADIUS * 1.5) {
                triggerA();
            }
            // Check distance to B
            if (Math.hypot(x - pB.x, y - pB.y) < RADIUS * 1.5) {
                triggerB();
            }
        });

    </script>
</body>
</html>
